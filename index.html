<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timeline theo dõi tiến độ</title>
<style>
  :root{
    --navy:#1f3864; --blue:#2e5496; --green:#2e7d32; --amber:#ed9c28;
    --gray:#8a94a6; --line:#1f3864; --bg:#eef2f7; --card:#ffffff;
    --text:#1f2733; --muted:#5b6472; --danger:#c0392b; --ok:#2e7d32;
    --shadow:0 6px 20px rgba(31,56,100,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"Helvetica Neue",sans-serif;
       background:var(--bg);color:var(--text);line-height:1.5}
  a{color:var(--blue)}

  header.top{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:22px 18px 26px}
  .wrap{max-width:1000px;margin:0 auto}
  header.top h1{margin:0 0 4px;font-size:clamp(20px,3.4vw,30px);font-weight:800;letter-spacing:.3px}
  header.top .sub{opacity:.85;font-size:14px}

  .stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px}
  .stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
        border-radius:14px;padding:12px 16px;flex:1;min-width:150px;backdrop-filter:blur(4px)}
  .stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.6px;opacity:.85}
  .stat .v{font-size:26px;font-weight:800;margin-top:2px}
  .overallbar{height:10px;border-radius:8px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}
  .overallbar>i{display:block;height:100%;background:#7ee0a0;border-radius:8px;transition:width .5s}

  /* Quick links box */
  .linksbox{margin-top:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
       border-radius:14px;padding:12px 16px}
  .linksbox-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .linksbox-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;opacity:.9;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--navy);
        border-radius:20px;padding:7px 13px;font-size:13.5px;font-weight:700;text-decoration:none;
        box-shadow:0 2px 6px rgba(0,0,0,.12);transition:.15s}
  .chip:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .chip .ic{font-size:15px}
  .chip .edit{margin-left:2px;border:0;background:#eef1f6;border-radius:50%;width:20px;height:20px;
        cursor:pointer;font-size:11px;display:none;align-items:center;justify-content:center;color:var(--muted)}
  body.editing .chip .edit{display:inline-flex}
  .chips .empty-links{font-size:13px;opacity:.75;color:#fff}

  .toolbar{max-width:1000px;margin:16px auto 0;padding:0 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;
       background:var(--navy);color:#fff;transition:.15s;display:inline-flex;gap:7px;align-items:center}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid #cdd6e4}
  .btn.green{background:var(--green)}
  .btn.small{padding:7px 11px;font-size:13px}
  .btn.danger{background:var(--danger)}
  .spacer{flex:1}
  .status-msg{font-size:13px;color:var(--muted)}

  /* Timeline */
  .timeline{max-width:1000px;margin:24px auto 60px;padding:0 18px;position:relative}
  .timeline::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;
       background:var(--line);transform:translateX(-50%);border-radius:4px}
  .node{position:relative;width:50%;padding:14px 34px;margin:2px 0}
  .node.left{left:0;text-align:right}
  .node.right{left:50%;text-align:left}
  .dot{position:absolute;top:26px;width:18px;height:18px;border-radius:50%;background:#fff;
       border:4px solid var(--blue);z-index:2}
  .node.left .dot{right:-9px}
  .node.right .dot{left:-9px}
  .node.done .dot{border-color:var(--green);background:var(--green)}
  .node.doing .dot{border-color:var(--blue)}
  .node.todo .dot{border-color:var(--gray)}

  .card{display:inline-block;text-align:left;background:var(--card);border-radius:14px;
        box-shadow:var(--shadow);padding:14px 16px;max-width:380px;width:100%;
        border-left:5px solid var(--gray);position:relative}
  .node.done .card{border-left-color:var(--green)}
  .node.doing .card{border-left-color:var(--blue)}
  .node.todo .card{border-left-color:var(--gray)}
  .card .date{font-size:12.5px;font-weight:800;color:var(--blue);letter-spacing:.3px}
  .card .title{font-size:15.5px;font-weight:700;margin:3px 0 8px}
  .card .note{font-size:13px;color:var(--muted);background:#f6f8fb;border-left:3px solid #cdd6e4;
       border-radius:0 8px 8px 0;padding:7px 10px;margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
  .card .note b{color:var(--navy)}
  .pbar{height:12px;border-radius:8px;background:#edf1f6;overflow:hidden}
  .pbar>i{display:block;height:100%;border-radius:8px;background:var(--blue);transition:width .5s}
  .node.done .pbar>i{background:var(--green)}
  .node.todo .pbar>i{background:var(--gray)}
  .prow{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}
  .pct{font-weight:800}
  .badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;color:#fff;background:var(--gray)}
  .node.done .badge{background:var(--green)}
  .node.doing .badge{background:var(--blue)}
  .card .edit-actions{margin-top:10px;display:none;gap:8px}
  body.editing .card .edit-actions{display:flex}

  /* Exam node */
  .exam{width:100%;text-align:center;padding:10px 0 0;left:0!important}
  .exam .card{max-width:520px;margin:0 auto;text-align:center;border:0;
       background:linear-gradient(135deg,#c0392b,#e05141);color:#fff;box-shadow:0 10px 30px rgba(192,57,43,.35)}
  .exam .card .date{color:#ffe1dc}
  .exam .card .title{font-size:20px;margin:2px 0 6px}
  .exam .card .count{font-size:14px;opacity:.95;font-weight:700}
  .exam .dot{left:50%;transform:translateX(-50%);border-color:#c0392b;background:#c0392b;top:-9px}

  @media(max-width:720px){
    .timeline::before{left:22px}
    .node,.node.left,.node.right{width:100%;left:0;text-align:left;padding:10px 0 10px 52px}
    .node.left .dot,.node.right .dot{left:13px;right:auto}
    .card{max-width:none}
    .exam{padding-left:0}
    .exam .dot{left:22px;transform:none}
  }

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,28,45,.55);display:none;align-items:center;
       justify-content:center;padding:16px;z-index:50}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 14px;font-size:18px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .field input,.field select{width:100%;padding:10px 12px;border:1.5px solid #cdd6e4;border-radius:10px;font-size:14px;font-family:inherit}
  .rangewrap{display:flex;align-items:center;gap:10px}
  .rangewrap output{font-weight:800;min-width:44px;text-align:right}
  .modal-actions{display:flex;gap:10px;margin-top:8px}
  .modal-actions .btn{flex:1;justify-content:center}
  .hint{font-size:12px;color:var(--muted);margin-top:2px}

  footer{max-width:1000px;margin:0 auto 40px;padding:0 18px;color:var(--muted);font-size:13px;text-align:center}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1 id="siteTitle">Timeline theo dõi tiến độ công việc</h1>
      <div class="sub">Cập nhật trực tiếp trên web · lưu tự động</div>
      <div class="stats">
        <div class="stat">
          <div class="k">Tiến độ tổng thể</div>
          <div class="v"><span id="overallPct">0%</span></div>
          <div class="overallbar"><i id="overallBar" style="width:0%"></i></div>
        </div>
        <div class="stat">
          <div class="k">Ngày thi</div>
          <div class="v" id="examDate">—</div>
        </div>
        <div class="stat">
          <div class="k">Còn lại</div>
          <div class="v" id="examCountdown">—</div>
        </div>
      </div>

      <div class="linksbox">
        <div class="linksbox-head">
          <span class="linksbox-title">🔗 Liên kết nhanh (Google Sheet, tài liệu…)</span>
          <button class="btn ghost small linkadd" id="btnAddLink" style="display:none">➕ Thêm link</button>
        </div>
        <div class="chips" id="quicklinks"></div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn green" id="btnEdit">✏️ Chỉnh sửa</button>
    <button class="btn ghost small" id="btnAdd" style="display:none">➕ Thêm mốc</button>
    <button class="btn ghost small" id="btnRefresh">↻ Tải lại</button>
    <div class="spacer"></div>
    <span class="status-msg" id="statusMsg"></span>
  </div>

  <div class="timeline" id="timeline"></div>

  <footer>
    Thanhkaka ·
    <span id="conn">chưa kết nối</span>
  </footer>

  <!-- Edit modal -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3 id="modalTitle">Sửa mốc công việc</h3>
      <div class="field">
        <label>Ngày</label>
        <input type="date" id="fDate" />
      </div>
      <div class="field">
        <label>Nội dung công việc</label>
        <input type="text" id="fTitle" placeholder="VD: Mời PA06 quét an ninh" />
      </div>
      <div class="field">
        <label>Note chi tiết (tùy chọn)</label>
        <textarea id="fNote" rows="3" placeholder="Ghi chú chi tiết: người phụ trách, lưu ý, kết quả..."
          style="width:100%;padding:10px 12px;border:1.5px solid #cdd6e4;border-radius:10px;font-size:14px;font-family:inherit;resize:vertical"></textarea>
      </div>
      <div class="field">
        <label>% Tiến độ</label>
        <div class="rangewrap">
          <input type="range" id="fProg" min="0" max="100" step="5" value="0" style="flex:1" />
          <output id="fProgOut">0%</output>
        </div>
      </div>
      <div class="field">
        <label><input type="checkbox" id="fExam" style="width:auto;vertical-align:middle" /> Đây là mốc "Ngày thi" (mốc kết thúc)</label>
      </div>
      <div class="modal-actions">
        <button class="btn danger small" id="btnDelete">Xóa</button>
        <button class="btn ghost small" id="btnCancel">Hủy</button>
        <button class="btn small" id="btnSave">Lưu</button>
      </div>
    </div>
  </div>

  <!-- Link modal -->
  <div class="modal-bg" id="linkModalBg">
    <div class="modal">
      <h3 id="linkModalTitle">Thêm liên kết</h3>
      <div class="field">
        <label>Tên hiển thị</label>
        <input type="text" id="lName" placeholder="VD: Bảng danh sách thí sinh" />
      </div>
      <div class="field">
        <label>Đường dẫn (URL)</label>
        <input type="url" id="lUrl" placeholder="https://docs.google.com/spreadsheets/..." />
        <div class="hint">Dán link Google Sheet / Drive / tài liệu bất kỳ.</div>
      </div>
      <div class="modal-actions">
        <button class="btn danger small" id="btnDeleteLink">Xóa</button>
        <button class="btn ghost small" id="btnCancelLink">Hủy</button>
        <button class="btn small" id="btnSaveLink">Lưu</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
